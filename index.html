<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-rose.png" />
    <title>Sagnik Das — Design Engineer</title>
    <!-- The loading screen's own flowers are tiny: ask for them first, before the page's code arrives. -->
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/rose-open.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/lily-open.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/rose-bud.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/lily-a.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/lily-b.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/lily-c.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/leaf-3.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/leaf-7.webp" />
    <link rel="preload" as="image" type="image/webp" fetchpriority="high" href="/flowers/sm/leaf-8.webp" />
    <!-- Shown the instant the page opens, before any script or stylesheet has loaded. The loading screen
         replaces it as soon as the page's code starts (see Loader.jsx). -->
    <style>
      html,
      body {
        margin: 0;
        background: #f1e6c4;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #f1e6c4;
        font: 700 11px/1 system-ui, sans-serif;
        letter-spacing: 0.22em;
        color: #861e50;
      }
      #boot i {
        display: block;
        width: 160px;
        height: 5px;
        border-radius: 5px;
        background: rgba(48, 13, 33, 0.14);
        overflow: hidden;
      }
      #boot i::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        border-radius: 5px;
        background: linear-gradient(90deg, #861e50, #dc9a9d);
        animation: boot-slide 1.3s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(240%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><i></i>SAGNIK DAS</div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
